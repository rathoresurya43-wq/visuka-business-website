<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Visuka Minerals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .form-input:focus {
      outline: none;
      ring: 2px;
      ring-color: #059669;
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- Contact Info Side -->
      <div class="bg-emerald-900 p-8 rounded-2xl text-white">
        <div class="mb-8">
          <h2 class="text-2xl font-bold mb-4">Factory Contact</h2>
          <p class="text-emerald-100">Get in touch with us for inquiries about Calcium Carbonate products.</p>
        </div>
        
        <div class="space-y-6">
          <div class="flex items-start">
            <div class="bg-emerald-800 p-3 rounded-lg mr-4">
              <svg class="w-6 h-6 text-emerald-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </div>
            <div>
              <p class="font-semibold text-emerald-100 text-sm uppercase tracking-wider mb-1">Manufacturing Plant</p>
              <p class="text-white leading-relaxed">
                F248, Makrana,<br />
                Rajasthan 341502,<br />
                India
              </p>
            </div>
          </div>
          
          <div class="flex items-start">
            <div class="bg-emerald-800 p-3 rounded-lg mr-4">
              <svg class="w-6 h-6 text-emerald-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
            </div>
            <div>
              <p class="font-semibold text-emerald-100 text-sm uppercase tracking-wider mb-1">Sales Hotline</p>
              <p class="text-white text-lg">+91-8375072152</p>
            </div>
          </div>

          <div class="flex items-start">
            <div class="bg-emerald-800 p-3 rounded-lg mr-4">
              <svg class="w-6 h-6 text-emerald-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
            </div>
            <div>
              <p class="font-semibold text-emerald-100 text-sm uppercase tracking-wider mb-1">Sales Email</p>
              <p class="text-white">sales@visukaminerals.com</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Side -->
      <div class="bg-white p-8 rounded-2xl shadow-lg">
        <div class="mb-6">
          <h3 class="text-2xl font-bold text-stone-900">Request a Quote</h3>
          <p class="text-stone-500 mt-2">Fill out the form below and we'll get back to you shortly.</p>
        </div>

        <form id="contact-form" class="space-y-6">
          <!-- Name -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">
              Full Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="fi-sender-fullName"
              required
              placeholder="John Doe"
              class="w-full px-4 py-3 bg-stone-50 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
            />
          </div>

          <!-- Company -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">
              Company <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="fi-text-company"
              required
              placeholder="Company Ltd."
              class="w-full px-4 py-3 bg-stone-50 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
            />
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">
              Work Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              name="fi-sender-email"
              required
              placeholder="john@company.com"
              class="w-full px-4 py-3 bg-stone-50 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
            />
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">
              Phone <span class="text-red-500">*</span>
            </label>
            <div class="flex">
              <select
                id="country-code"
                class="px-3 py-3 bg-stone-50 rounded-l-xl border border-r-0 border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
              >
                <option value="+91">🇮🇳 +91</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+65">🇸🇬 +65</option>
                <option value="+81">🇯🇵 +81</option>
                <option value="+86">🇨🇳 +86</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+39">🇮🇹 +39</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+7">🇷🇺 +7</option>
                <option value="+55">🇧🇷 +55</option>
                <option value="+27">🇿🇦 +27</option>
                <option value="+20">🇪🇬 +20</option>
                <option value="+90">🇹🇷 +90</option>
                <option value="+82">🇰🇷 +82</option>
                <option value="+62">🇮🇩 +62</option>
                <option value="+92">🇵🇰 +92</option>
                <option value="+880">🇧🇩 +880</option>
                <option value="+94">🇱🇰 +94</option>
                <option value="+977">🇳🇵 +977</option>
                <option value="+95">🇲🇲 +95</option>
                <option value="+84">🇻🇳 +84</option>
                <option value="+66">🇹🇭 +66</option>
                <option value="+63">🇵🇭 +63</option>
                <option value="+60">🇲🇾 +60</option>
                <option value="+98">🇮🇷 +98</option>
              </select>
              <input
                type="tel"
                name="fi-sender-phone"
                id="phone-input"
                required
                placeholder="9876543210"
                class="flex-1 px-4 py-3 bg-stone-50 rounded-r-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
              />
            </div>
          </div>

          <!-- Product Interest -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Product Interest</label>
            <select
              name="fi-text-product"
              class="w-full px-4 py-3 bg-stone-50 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all appearance-none"
            >
              <option value="">Select a product...</option>
              <option value="Calcium Carbonate Powder">Calcium Carbonate Powder</option>
              <option value="Calcite Lumps">Calcite Lumps</option>
              <option value="Calcite Powder">Calcite Powder</option>
              <option value="Uncoated Calcium Carbonate">Uncoated Calcium Carbonate</option>
              <option value="Other">Other / Custom Request</option>
            </select>
          </div>

          <!-- Message -->
          <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">
              Message <span class="text-red-500">*</span>
            </label>
            <textarea
              name="fi-text-message"
              rows="4"
              required
              placeholder="Please specify quantity, mesh size, and application..."
              class="w-full px-4 py-3 bg-stone-50 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all resize-none"
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full bg-stone-900 hover:bg-emerald-800 text-white px-6 py-4 rounded-xl font-bold transition-all duration-200 flex items-center justify-center"
          >
            Submit Inquiry
            <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </button>
        </form>

        <!-- Status Message -->
        <p id="form-status" class="mt-4 text-center text-sm font-medium"></p>
      </div>
    </div>
  </div>

  <!-- Forminit SDK -->
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>
  <script>
    const forminit = new Forminit();
    const countryCodeSelect = document.getElementById('country-code');
    const phoneInput = document.getElementById('phone-input');
    
    // Generate random phone number placeholder
    function generateRandomPhone() {
      const digits = [];
      for (let i = 0; i < 10; i++) {
        digits.push(Math.floor(Math.random() * 10));
      }
      return digits.join('');
    }
    
    phoneInput.placeholder = generateRandomPhone();
    
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('form-status');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      // Combine country code with phone number
      const countryCode = countryCodeSelect.value;
      const phoneNumber = phoneInput.value.replace(/\D/g, ''); // Remove non-digits
      phoneInput.value = countryCode + phoneNumber;
      
      // Disable button during submission
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Sending...';
      
      const { data, redirectUrl, error } = await forminit.submit('x378q8g10wp', new FormData(e.target));
      
      if (error) {
        statusEl.textContent = 'Error: ' + error.message;
        statusEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Submit Inquiry <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>`;
        return;
      }
      
      statusEl.textContent = 'Inquiry received! We\'ll get back to you shortly.';
      statusEl.className = 'mt-4 text-center text-sm font-medium text-emerald-600';
      e.target.reset();
      countryCodeSelect.value = '+91'; // Reset to India
      submitBtn.disabled = false;
      submitBtn.innerHTML = `Submit Inquiry <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>`;
    });
  </script>
</body>
</html>
